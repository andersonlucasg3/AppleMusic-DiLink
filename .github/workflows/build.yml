name: Build patch bundle

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # The app.morphe:* artifacts live in GitHub Packages of the MorpheApp org, so the
      # default GITHUB_TOKEN of this repository cannot read them. Add a repository secret
      # GPR_KEY with a token that has read:packages (and GPR_USER with the account name).
      # Without it the build fails at dependency resolution.
      - name: Build .mpp and patch list
        env:
          GITHUB_ACTOR: ${{ secrets.GPR_USER != '' && secrets.GPR_USER || github.actor }}
          GITHUB_TOKEN: ${{ secrets.GPR_KEY != '' && secrets.GPR_KEY || secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew clean :patches:generatePatchesList :patches:buildAndroid --no-daemon \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: patches-${{ github.run_number }}
          if-no-files-found: error
          path: |
            patches/build/libs/*.mpp
            patches-list.json
